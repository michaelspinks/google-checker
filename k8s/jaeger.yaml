apiVersion: v1
kind: Namespace
metadata:
  name: observability

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.55
        ports:
        - containerPort: 5775
        - containerPort: 6831
        - containerPort: 6832
        - containerPort: 5778
        - containerPort: 16686  # Web UI
        - containerPort: 14268  # Collector (HTTP)
        - containerPort: 9411   # Zipkin-compatible

---

apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector:
    app: jaeger
  ports:
    - name: web
      port: 16686
      targetPort: 16686
    - name: collector
      port: 14268
      targetPort: 14268
